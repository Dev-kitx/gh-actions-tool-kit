name: Bug Report
description: Report a problem with gh-actions-tool-kit
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Please fill out the details below to help us debug effectively.

  - type: input
    id: version
    attributes:
      label: Version
      description: "`pip show gh-actions-tool-kit` or `uv pip show gh-actions-tool-kit`"
      placeholder: "e.g., 0.1.0"
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module does the bug relate to?
      options:
        - actions_core
        - actions_exec
        - actions_io
        - artifact
        - cache
        - checks
        - context
        - github_client
        - graphql_client
        - models
        - oidc
        - payload_parser
        - retry
        - summary
        - testing
        - tool_cache
        - other / unsure
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: "e.g., 3.12.3"
    validations:
      required: true

  - type: dropdown
    id: runner_os
    attributes:
      label: Runner OS
      options:
        - ubuntu-latest
        - macos-latest
        - windows-latest
        - self-hosted (Linux)
        - self-hosted (macOS)
        - self-hosted (Windows)
        - local / not on a runner

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact commands or workflow steps.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or workflow output
      render: bash
